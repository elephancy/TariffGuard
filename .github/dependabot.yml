# Weekly dependency proposals; existing checks and review still apply.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: npm
  directory: /frontend
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: pip
  directory: /backend
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: terraform
  directory: /infra
  schedule:
    interval: weekly
  open-pull-requests-limit: 3
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
